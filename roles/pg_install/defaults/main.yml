---
# DB Configuration
pg_version: "{{ global_pg_version }}"
pg_port: "{{ global_pg_port }}"
pg_superuser_password: "{{ global_pg_password }}"

# Repository Configuration
pg_repo_url: "https://download.postgresql.org/pub/repos/yum/reporpms/EL-{{ global_rhel_major_version }}-x86_64/pgdg-redhat-repo-latest.noarch.rpm"

# Service and Paths
pg_service_name: "postgresql-{{ pg_version }}"
pg_config_path: "/var/lib/pgsql/{{ pg_version }}/data/postgresql.conf"